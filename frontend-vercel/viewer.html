<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>laser_sim · 3D live sim viewer</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0a; color: #ddd;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #app { display: grid; grid-template-rows: 1fr auto; height: 100vh; }
    #scene { position: relative; }
    canvas { display: block; }
    #panel { padding: 12px 16px; background: #161616; border-top: 1px solid #2a2a2a;
      font-size: 13px; display: grid; gap: 8px; grid-template-columns: 1fr auto auto auto;
      align-items: center; }
    #panel .meta { font-family: ui-monospace, "SF Mono", Menlo, monospace; color: #9ad; }
    button { background: #2a4d8a; color: white; border: 0; padding: 6px 14px;
      border-radius: 4px; cursor: pointer; font-size: 13px; }
    button:hover { background: #355fa9; }
    button.secondary { background: #444; }
    input[type=range] { width: 100%; }
    #legend { position: absolute; top: 14px; right: 14px; background: rgba(0,0,0,0.55);
      padding: 8px 10px; border-radius: 4px; font-size: 12px; pointer-events: none; }
    #status { position: absolute; top: 14px; left: 14px; background: rgba(0,0,0,0.55);
      padding: 8px 10px; border-radius: 4px; font-size: 12px; max-width: 360px; }
    .key { color: #9ad; }
    .v { color: #fff; }
    h1 { margin: 0; font-size: 16px; font-weight: 500; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/[email protected]/build/three.module.js",
      "three/addons/": "https://unpkg.com/[email protected]/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<div id="app">
  <div id="scene">
    <div id="status">
      <h1>laser_sim live sim</h1>
      <div id="meta"></div>
    </div>
    <div id="legend">
      <div><span class="key">color</span> → T_max [K]</div>
      <div><span class="key">red sphere</span> → laser head</div>
      <div><span class="key">path</span> → power-coloured</div>
    </div>
  </div>
  <div id="panel">
    <div class="meta" id="time">t = 0.000 s</div>
    <button id="play">▶ Play</button>
    <button id="reset" class="secondary">↺ Reset</button>
    <input id="seek" type="range" min="0" max="100" value="0" />
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const sceneUrl = new URLSearchParams(location.search).get('scene') || './scene.json';

async function main() {
  const r = await fetch(sceneUrl, { cache: 'no-store' });
  if (!r.ok) {
    document.getElementById('meta').textContent = 'FAILED to load ' + sceneUrl;
    return;
  }
  const data = await r.json();
  init(data);
}

function jetColor(t) {
  // t in [0, 1]
  const r = Math.max(0, Math.min(1, 1.5 - Math.abs(4 * t - 3)));
  const g = Math.max(0, Math.min(1, 1.5 - Math.abs(4 * t - 2)));
  const b = Math.max(0, Math.min(1, 1.5 - Math.abs(4 * t - 1)));
  return [r, g, b];
}

function init(data) {
  const container = document.getElementById('scene');
  const meta = document.getElementById('meta');
  meta.innerHTML =
    `<div><span class="key">scenario</span> <span class="v">${data.scenario_id.slice(0,8)}</span></div>` +
    `<div><span class="key">grid</span> <span class="v">${data.meta.grid_n}²</span> ` +
    `<span class="key">frames</span> <span class="v">${data.meta.n_frames}</span> ` +
    `<span class="key">path</span> <span class="v">${data.meta.n_path_samples} pts</span></div>`;

  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || (window.innerHeight - 80);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a0a);

  const roi = data.roi_mm;  // [x0, y0, x1, y1]
  const cx = 0.5 * (roi[0] + roi[2]);
  const cy = 0.5 * (roi[1] + roi[3]);
  const extent = Math.max(roi[2] - roi[0], roi[3] - roi[1]);

  const camera = new THREE.PerspectiveCamera(55, w / h, 0.01, 1000);
  camera.position.set(cx + extent * 1.4, cy - extent * 1.4, extent * 1.6);
  camera.up.set(0, 0, 1);
  camera.lookAt(cx, cy, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(w, h);
  container.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(cx, cy, 0);
  controls.enableDamping = true;

  // Build plate plane (slightly darker for contrast)
  const plate = new THREE.Mesh(
    new THREE.PlaneGeometry(extent * 1.3, extent * 1.3),
    new THREE.MeshBasicMaterial({ color: 0x111111, side: THREE.DoubleSide })
  );
  plate.position.set(cx, cy, -0.02);
  scene.add(plate);

  // Build heightfield/heat plane from the first frame
  const Nx = data.field.grid_x_mm.length;
  const Ny = data.field.grid_y_mm.length;
  const width = data.field.grid_x_mm[Nx - 1] - data.field.grid_x_mm[0];
  const height = data.field.grid_y_mm[Ny - 1] - data.field.grid_y_mm[0];
  const planeGeom = new THREE.PlaneGeometry(width, height, Nx - 1, Ny - 1);
  // shift to grid centre
  planeGeom.translate(0.5 * (data.field.grid_x_mm[0] + data.field.grid_x_mm[Nx-1]),
                      0.5 * (data.field.grid_y_mm[0] + data.field.grid_y_mm[Ny-1]),
                      0);
  const colors = new Float32Array(Nx * Ny * 3);
  planeGeom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const planeMat = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide });
  const heatPlane = new THREE.Mesh(planeGeom, planeMat);
  heatPlane.position.z = 0.0;
  scene.add(heatPlane);

  // Bounds for color mapping (preheat -> hottest)
  const allMax = data.field.frames.reduce((a, f) => Math.max(a, ...f.t_max_K.flat()), 0);
  const tLo = 300, tHi = Math.max(allMax, data.field.liquidus_K);

  function setFrame(idx) {
    const frame = data.field.frames[idx];
    if (!frame) return;
    const arr = frame.t_max_K;
    let k = 0;
    // PlaneGeometry vertex order: rows of Ny+1 along x, scanning y
    // Three.js PlaneGeometry with widthSegments=Nx-1, heightSegments=Ny-1
    // produces vertices indexed (iy * Nx + ix), iterating ix fastest
    for (let iy = 0; iy < Ny; iy++) {
      for (let ix = 0; ix < Nx; ix++) {
        const T = arr[ix][iy];
        const t = Math.max(0, Math.min(1, (T - tLo) / (tHi - tLo)));
        const [r, g, b] = jetColor(t);
        colors[k++] = r;
        colors[k++] = g;
        colors[k++] = b;
      }
    }
    planeGeom.attributes.color.needsUpdate = true;
    // displace heightfield by normalized T
    const pos = planeGeom.attributes.position.array;
    for (let i = 0; i < Nx * Ny; i++) {
      const ix = i % Nx;
      const iy = Math.floor(i / Nx);
      const T = arr[ix][iy];
      const t = Math.max(0, Math.min(1, (T - tLo) / (tHi - tLo)));
      pos[i * 3 + 2] = t * extent * 0.18;
    }
    planeGeom.attributes.position.needsUpdate = true;
    planeGeom.computeVertexNormals();
    document.getElementById('time').textContent = `t = ${frame.t_s.toFixed(4)} s   (frame ${idx + 1}/${data.field.frames.length})`;
    // update seek slider
    seek.value = idx;
    // laser head position
    const tnow = frame.t_s;
    const path = data.path;
    let j = 0;
    while (j < path.t_s.length - 1 && path.t_s[j] < tnow) j++;
    laser.position.set(path.x_mm[j], path.y_mm[j], extent * 0.22);
  }

  // Scan path polyline
  const pathPositions = [];
  const pathColors = [];
  const pmax = Math.max(...data.path.power_W);
  for (let i = 0; i < data.path.x_mm.length; i++) {
    pathPositions.push(data.path.x_mm[i], data.path.y_mm[i], 0.01);
    const tp = data.path.power_W[i] / Math.max(pmax, 1e-9);
    const [r, g, b] = jetColor(tp);
    pathColors.push(r, g, b);
  }
  const pathGeom = new THREE.BufferGeometry();
  pathGeom.setAttribute('position', new THREE.Float32BufferAttribute(pathPositions, 3));
  pathGeom.setAttribute('color', new THREE.Float32BufferAttribute(pathColors, 3));
  const pathLine = new THREE.Line(pathGeom, new THREE.LineBasicMaterial({ vertexColors: true }));
  scene.add(pathLine);

  // Laser head
  const laser = new THREE.Mesh(
    new THREE.SphereGeometry(extent * 0.025, 16, 12),
    new THREE.MeshBasicMaterial({ color: 0xff3232 })
  );
  scene.add(laser);

  // Axes / grid for orientation
  const grid = new THREE.GridHelper(extent * 1.2, 12, 0x333333, 0x222222);
  grid.rotation.x = Math.PI / 2;
  grid.position.set(cx, cy, -0.01);
  scene.add(grid);

  // playback state
  let frameIdx = 0;
  let playing = false;
  let lastT = performance.now();
  setFrame(0);

  const playBtn = document.getElementById('play');
  const resetBtn = document.getElementById('reset');
  const seek = document.getElementById('seek');
  seek.max = data.field.frames.length - 1;
  playBtn.onclick = () => {
    playing = !playing;
    playBtn.textContent = playing ? '⏸ Pause' : '▶ Play';
  };
  resetBtn.onclick = () => { frameIdx = 0; setFrame(0); };
  seek.oninput = () => { frameIdx = parseInt(seek.value); setFrame(frameIdx); };

  function animate() {
    const now = performance.now();
    const dt = (now - lastT) / 1000;
    lastT = now;
    if (playing) {
      // advance ~ 8 frames/sec
      frameIdx = (frameIdx + Math.max(1, Math.floor(dt * 8))) % data.field.frames.length;
      setFrame(frameIdx);
    }
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }
  animate();

  window.addEventListener('resize', () => {
    const w2 = container.clientWidth || window.innerWidth;
    const h2 = container.clientHeight || (window.innerHeight - 80);
    renderer.setSize(w2, h2);
    camera.aspect = w2 / h2;
    camera.updateProjectionMatrix();
  });
}

main().catch(err => {
  document.getElementById('meta').textContent = 'ERROR: ' + err.message;
  console.error(err);
});
</script>
</body>
</html>
